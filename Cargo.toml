[workspace]
resolver = "2"
members = ["crates/map_core", "crates/map_io", "crates/map_render", "crates/map_app", "crates/map_bench", "crates/map_api", "crates/map_ai", "crates/map_perf"]

[workspace.package]
version = "0.2.5-alpha"
edition = "2021"
license = "MIT"
repository = "https://github.com/UnknownGlyph/atlas-forge"

[workspace.dependencies]
base64 = "0.22"
map_core = { path = "crates/map_core" }
map_io = { path = "crates/map_io" }
map_render = { path = "crates/map_render" }
map_ai = { path = "crates/map_ai" }
imbl = { version = "7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
lz4_flex = "0.14"
csv = "1.4"
earcutr = "0.5"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "links"] }
rfd = "0.17"
tiny-skia = "0.12"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
