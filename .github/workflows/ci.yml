# Continuous integration: every push and pull request is built, tested and
# linted on Windows, the one platform Atlas Forge supports so far (Linux
# and macOS come later). `tools/check.cmd` runs the same steps locally.
name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build, test and lint
        shell: cmd
        run: tools\check.cmd
