      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="512" cy="530" r="290"/></clipPath>
    <clipPath id="land"><path d="M 170 330 C 260 230 400 220 470 262 C 530 296 600 280 630 330 C 650 380 590 420 540 440 C 500 470 470 520 420 540 C 360 565 330 610 280 590 C 230 570 200 520 170 500 Z"/></clipPath>
    <clipPath id="before"><rect x="0" y="530" width="1024" height="494"/></clipPath>
