<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Atlas Forge program icon (simplified, for 16-32 px). Hand-written vector; render with tools/make_icon.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282D"/>
      <stop offset="0.45" stop-color="#121316"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="tileglow" cx="0.5" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="ocean" cx="0.36" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#4A4F59"/>
      <stop offset="0.55" stop-color="#22252B"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </radialGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E7C1"/>
      <stop offset="1" stop-color="#CDB07A"/>
    </linearGradient>
    <linearGradient id="champagne2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9BE86"/>
      <stop offset="1" stop-color="#A98648"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.30" cy="0.24" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEBC4"/>
      <stop offset="0.45" stop-color="#D8B36A"/>
      <stop offset="1" stop-color="#8E6A2E"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#F7DFA6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7DFA6" stop-opacity="0"/>
