  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#tile)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#tileglow)"/>
  <rect x="46" y="46" width="932" height="932" rx="210" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <ellipse cx="512" cy="566" rx="322" ry="322" fill="url(#drop)"/>

  <g transform="rotate(-22 512 530)">
    <ellipse cx="512" cy="530" rx="418" ry="126" fill="none" stroke="url(#gold)" stroke-opacity="0.85" stroke-width="40"/>
  </g>

  <circle cx="512" cy="530" r="290" fill="url(#ocean)"/>
  <g clip-path="url(#globe)">
    <path d="M 170 330 C 260 230 400 220 470 262 C 530 296 600 280 630 330 C 650 380 590 420 540 440 C 500 470 470 520 420 540 C 360 565 330 610 280 590 C 230 570 200 520 170 500 Z" fill="url(#champagne)"/>
    <path d="M 452 250 C 470 330 420 380 455 445 C 470 480 440 520 430 548 L 900 548 L 900 150 Z" fill="url(#champagne2)" clip-path="url(#land)"/>
    <path d="M 452 250 C 470 330 420 380 455 445 C 470 480 440 520 430 548" fill="none" stroke="#141518" stroke-width="14" stroke-linecap="round" clip-path="url(#land)"/>
    <path d="M 610 600 C 650 560 730 570 740 620 C 750 680 690 720 640 700 C 600 685 585 635 610 600 Z" fill="url(#champagne)"/>
  </g>
  <circle cx="512" cy="530" r="290" fill="url(#shine)"/>
  <circle cx="512" cy="530" r="290" fill="none" stroke="#E8ECF2" stroke-opacity="0.22" stroke-width="6"/>

  <g transform="rotate(-22 512 530)">
    <ellipse cx="512" cy="530" rx="418" ry="126" fill="none" stroke="url(#gold)" stroke-width="40" clip-path="url(#before)"/>
